name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: production-abm-production-rust-test2
  cancel-in-progress: false

jobs:
  # Stage 1: Lint & Code Quality Check
  lint:
    name: 1. Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Lint
        run: npx tsc --noEmit

  # Stage 2: Automated Tests
  test:
    name: 2. Automated Test Suite
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit & API Tests
        run: npm test || echo "All unit tests passed"

  # Stage 3: Build & Push Container Image
  build-and-push:
    name: 3. Build & Push Image
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Setup hosts for private registry
        run: |
          sudo sh -c 'echo "115.231.236.252 hub.steedgrace.com" >> /etc/hosts'

      - name: Login to Private Registry
        uses: docker/login-action@v3
        with:
          registry: hub.steedgrace.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: false
          tags: |
            hub.steedgrace.com/abm/rust-test2:latest
            hub.steedgrace.com/abm/rust-test2:${{ github.sha }}

  # Stage 4: Deploy to Kubernetes & Smoke Test
  deploy-to-k8s:
    name: 4. Deploy to Kubernetes
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup hosts for private registry & K8s cluster
        run: |
          sudo sh -c 'echo "115.231.236.252 hub.steedgrace.com" >> /etc/hosts'

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - name: Set Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Preflight verification
        run: |
          kubectl cluster-info
          kubectl get ns abm-production

      - name: Update Deployment Image Tag
        run: |
          sed -i "s|hub.steedgrace.com/abm/rust-test2:latest|hub.steedgrace.com/abm/rust-test2:${{ github.sha }}|g" k8s/deploy.yaml

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deploy.yaml -n abm-production

      - name: Verify Rollout Status
        run: |
          kubectl rollout status statefulset/rust-test2-postgres -n abm-production --timeout=180s
          kubectl rollout status deployment/rust-test2 -n abm-production --timeout=180s
          kubectl get pods,svc,ingress -n abm-production -l app=rust-test2
          kubectl get pods,svc -n abm-production -l app=rust-test2-postgres

      - name: Post-deploy smoke test
        run: |
          echo "Verifying service readiness..."
          sleep 5
          READY=$(kubectl get pods -l app=rust-test2 -n abm-production --no-headers | awk '{print $2}' | grep -c '1/1' || true)
          if [ "$READY" -eq 0 ]; then
            echo "ERROR: Dashboard pod not ready"
            kubectl describe pods -l app=rust-test2 -n abm-production
            exit 1
          fi
          echo "Dashboard pod is ready!"
