name: Build and Deploy to Kubernetes

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup hosts for private registry
        run: |
          sudo sh -c 'echo "115.231.236.252 hub.steedgrace.com" >> /etc/hosts'

      - name: Login to Private Registry
        uses: docker/login-action@v3
        with:
          registry: hub.steedgrace.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            hub.steedgrace.com/abm/rust-test2:latest
            hub.steedgrace.com/abm/rust-test2:${{ github.sha }}

  deploy-to-k8s:
    name: Deploy to Kubernetes Cluster
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup hosts for private registry & K8s cluster
        run: |
          sudo sh -c 'echo "115.231.236.252 hub.steedgrace.com" >> /etc/hosts'

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - name: Set Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Update Deployment Image Tag
        run: |
          sed -i "s|hub.steedgrace.com/abm/rust-test2:latest|hub.steedgrace.com/abm/rust-test2:${{ github.sha }}|g" k8s/deploy.yaml

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deploy.yaml -n abm-production

      - name: Verify Rollout Status
        run: |
          kubectl rollout status statefulset/rust-test2-postgres -n abm-production --timeout=180s
          kubectl rollout status deployment/rust-test2 -n abm-production --timeout=180s
          kubectl get pods,svc,ingress -n abm-production -l app=rust-test2
          kubectl get pods,svc -n abm-production -l app=rust-test2-postgres
